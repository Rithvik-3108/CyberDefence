# Render Blueprint: creates both services from this one repo.
# Dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: cybersecurity-ann-api
    runtime: python
    rootDir: backend
    plan: standard            # TensorFlow + models need ~1-2 GB RAM; free/starter (512 MB) usually crash
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_TOKEN
        sync: false           # paste in dashboard (only needed if the HF repo is private)
      - key: ALLOWED_ORIGINS
        sync: false           # paste your frontend URL after it is deployed
      - key: MAX_UPLOAD_MB
        value: "30"

  - type: web
    name: cybersecurity-ann-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false           # paste your backend URL, e.g. https://cybersecurity-ann-api.onrender.com
      - key: VITE_MAX_UPLOAD_MB
        value: "30"